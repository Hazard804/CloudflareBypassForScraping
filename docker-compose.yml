services:
  cloudflare-bypass:
    image: ghcr.io/sarperavci/cloudflarebypassforscraping:latest
    container_name: cloudflare-bypass
    ports:
      - "8000:8000"
    environment:
      - WORKERS=3
      - CF_BROWSERS=3  # each headless Brave takes ~200-400 MB; raise the memory limit with this
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2'
    shm_size: 2g
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(b'total' not in urllib.request.urlopen('http://127.0.0.1:8000/browsers', timeout=4).read())"]
      interval: 30s
      timeout: 5s
      start_period: 60s
    restart: unless-stopped
